services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: igname
      POSTGRES_PASSWORD: igname
      POSTGRES_DB: igname
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    depends_on: [db, redis]
    ports: ["8000:8000"]
    volumes: ["./backend:/code"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
